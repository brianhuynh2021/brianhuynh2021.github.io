<!DOCTYPE html>
<html class="no-js" lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Huynh Nguyen Resume</title>
    <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">
    <link rel="icon" href="../favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700,900" rel="stylesheet">
    <link rel="stylesheet" href="../libs/font-awesome/css/font-awesome.min.css">
    <link href="../css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/styles.css" rel="stylesheet">
</head>

<body class="resume-page">
    <main id="resume-page">
        <section id="resume-card" class="shadow-large">
            <a class="resume-back-link" href="../index.html">
                <i class="fa fa-chevron-left" aria-hidden="true"></i>
                Portfolio
            </a>
            <h1 id="resume-name">Huynh Nguyen</h1>
            <p id="resume-title">Software Engineer</p>
            <a id="resume-download" href="../HuynhNguyen_resume.pdf" download="HuynhNguyen_resume.pdf" class="btn-rounded-white">Download Resume</a>
            <a id="resume-open" href="../HuynhNguyen_resume.pdf" target="_blank" class="btn-rounded-white">Open PDF</a>
            <div id="resume-local-tools" hidden>
                <label for="resume-upload" class="btn-rounded-white resume-upload-button">Attach New Resume</label>
                <input id="resume-upload" type="file" accept="application/pdf" hidden>
                <div id="resume-upload-status" role="status" aria-live="polite"></div>
            </div>
        </section>
    </main>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
    <script src="../js/resume.js"></script>
</body>

</html>
